# =============================================================================
# Data Lake (MinIO) + Data Warehouse (PostgreSQL) — HUOL/UFRN BI
# Uso:
#   docker compose up -d
#   docker compose ps            # conferir serviços
#   MinIO Console: http://localhost:9001  (usuário/senha: minioadmin/minioadmin)
#   PostgreSQL:    localhost:5432        (huol/huol_secret, banco huol_dw)
# =============================================================================
services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: huol_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: huol_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: huol
      POSTGRES_PASSWORD: huol_secret
      POSTGRES_DB: huol_dw
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huol -d huol_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
